[workspace]
members = [
  "crates/unionbreeze-core",
  "crates/unionbreeze-typescript",
  "crates/unionbreeze-protocol",
  "crates/unionbreeze-lsp",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/IvanKobtsev/UnionBreeze"

[workspace.dependencies]
anyhow = "1"
arc-swap = "1.7"
ignore = "0.4"
lsp-server = "0.7"
lsp-types = "0.95.1"
oxc_allocator = "0.75.1"
oxc_parser = "0.75.1"
oxc_span = "0.75.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"
