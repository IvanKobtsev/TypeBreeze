[workspace]
members = [
  "crates/typebreeze-protocol",
  "crates/typebreeze-lsp",
]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/IvanKobtsev/TypeBreeze"

[workspace.dependencies]
anyhow = "1"
lsp-server = "0.7"
lsp-types = "0.95.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"
